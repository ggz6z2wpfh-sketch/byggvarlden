<!doctype html><html lang="sv"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#7950b5"><title>Byggvärlden</title><style>*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#eee2ff,#ffe6f3);font:600 17px system-ui;color:#382650;min-height:100vh}main{max-width:560px;margin:auto;padding:18px}h1,h2{text-align:center}button,input,select{font:inherit}button{border:0;border-radius:16px;padding:15px;background:white;color:#382650;box-shadow:0 3px 0 #d9c8eb;cursor:pointer}button:active{transform:translateY(2px)}.big{display:block;width:100%;margin:12px 0;font-size:20px;background:#fff}.green{background:#bdebc8}.pink{background:#ffcce6}.yellow{background:#ffe7a0}.panel{background:#ffffffb8;border-radius:24px;padding:18px;margin:12px 0}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.row button{flex:1}.symbol{font-size:80px;text-align:center}.task{display:flex;align-items:center;gap:12px;width:100%;text-align:left;margin:8px 0}.task img{width:60px;height:60px;object-fit:cover;border-radius:10px}.task span{font-size:30px}.bar{height:12px;background:#ded0ed;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;background:#65b980}.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:3px;background:#e1d7f2;padding:8px;border-radius:12px}.cell{aspect-ratio:1;padding:0;border-radius:4px;box-shadow:none;font-size:19px;min-width:0}.swatch{width:42px;height:42px;padding:0;border:3px solid white}.avatar{display:block;margin:auto;width:140px;height:160px;object-fit:contain}.confetti{position:fixed;top:-20px;pointer-events:none;animation:fall 2s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(600deg)}}input:not([type=file]):not([type=checkbox]){max-width:100%;padding:9px;border:1px solid #cbb9df;border-radius:8px}small{font-weight:400}label{display:block;margin:10px 0}textarea{width:100%;min-height:80px;font:inherit} .muted{opacity:.75}</style><main id="app"></main><script>
const defaults={name:'',gym:4,morning:[['🚽','GÅ PÅ TOALETTEN'],['👚','TA AV PYJAMAS'],['👕','TA PÅ KLÄDER'],['🥣','ÄT FRUKOST'],['🪥','BORSTA TÄNDERNA'],['🪮','BORSTA HÅRET'],['🎒','KONTROLLERA SKOLVÄSKAN'],['👟','PACKA GYMPAKLÄDER',true],['🧥','TA PÅ YTTERKLÄDER']],home:[['👟','STÄLL SKORNA PÅ PLATS'],['🧥','HÄNG UPP JACKAN'],['🎒','HÄNG UPP SKOLVÄSKAN'],['💧','TA UT VATTENFLASKAN'],['💧','STÄLL VATTENFLASKAN I KÖKET'],['🍱','TA UT MATLÅDAN'],['🍱','STÄLL MATLÅDAN I KÖKET'],['👕','TA UT ANVÄNDA GYMPAKLÄDER',true],['🧺','LÄGG GYMPAKLÄDERNA I TVÄTTKORGEN',true],['📄','TA UT PAPPER OCH INFORMATION FRÅN SKOLAN'],['🧼','TVÄTTA HÄNDERNA'],['🍎','ÄT MELLANMÅL']],avatar:'',face:'😊',shirt:'#f49bcf',photos:{},blocks:0,world:{},craft:{},date:'',done:{},earned:{}};let s;try{s={...defaults,...JSON.parse(localStorage.getItem('byggworld-v1')||'{}')}}catch{s=structuredClone(defaults)}let page='start',mode='one',pos=0,color='#e997c8',piece='block',notice='';const app=document.querySelector('#app'),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function save(){try{localStorage.setItem('byggworld-v1',JSON.stringify(s))}catch{alert('Telefonens lagring är full. Bilden eller ändringen kunde inte sparas.')}}function day(){let d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()}function reset(){if(s.date!==day()){s.date=day();s.done={};s.earned={};save()}}function go(p){page=p;pos=0;render();scrollTo(0,0)}function speak(t){if('speechSynthesis'in window){let u=new SpeechSynthesisUtterance(t);u.lang='sv-SE';speechSynthesis.cancel();speechSynthesis.speak(u)}else alert('Uppläsning stöds inte här.')}function avatar(){return s.avatar?`<img class="avatar" src="${s.avatar}" alt="Min avatar">`:`<div class="symbol" style="font-size:65px">${s.face}<br><span style="color:${s.shirt};font-size:45px">■</span></div>`}function tasks(){return s[page].map((t,i)=>({t,i,k:page+i})).filter(x=>!x.t[2]||new Date().getDay()===Number(s.gym))}function pic(x){return s.photos[x.k]?`<img style="max-width:100%;max-height:150px;border-radius:12px" src="${s.photos[x.k]}">`:`<span>${esc(x.t[0])}</span>`}function mark(k){let was=tasks().every(x=>s.done[x.k]);s.done[k]=!s.done[k];if(s.done[k]&&!s.earned[k]){s.earned[k]=true;s.blocks++}save();if(!was&&tasks().every(x=>s.done[x.k]))celebrate();render()}function celebrate(){for(let i=0;i<35;i++){let e=document.createElement('span');e.className='confetti';e.textContent=['🎉','⭐','🟪','💗'][i%4];e.style.left=Math.random()*100+'vw';e.style.animationDelay=Math.random()*.5+'s';document.body.append(e);setTimeout(()=>e.remove(),2600)}}function back(){return '<button onclick="go(\'start\')">← HEM</button>'}function render(){reset();let weekend=[0,6].includes(new Date().getDay());if(page==='start'){app.innerHTML=`<h1>🧱 ${esc(s.name?s.name.toUpperCase()+'S ':'')}BYGGVÄRLD</h1>${avatar()}<h2>${s.name?'HEJ '+esc(s.name.toUpperCase())+'!':'HEJ BYGGARE!'}</h2><p style="text-align:center">EN SAK I TAGET, I DIN EGEN TAKT!</p>${weekend?'<div class="panel">🎨 HELG! IDAG ÄR DET FRI BYGGLEK.</div>':'<button class="big yellow" onclick="go(\'morning\')">☀️ MORGONUPPDRAG</button><button class="big green" onclick="go(\'home\')">🏡 HEMMA IGEN</button>'}<button class="big pink" onclick="go('world')">🧱 MIN BYGGVÄRLD · ${s.blocks} DELAR</button><button class="big" onclick="go('craft')">🎨 PYSSELVERKSTAD</button><button class="big" onclick="go('avatar')">👤 MIN AVATAR</button><button onclick="go('parent')">⚙️ FÖRÄLDRALÄGE</button>`;return}if(page==='morning'||page==='home'){let a=tasks(),n=a.filter(x=>s.done[x.k]).length,x=a.find(x=>!s.done[x.k]);app.innerHTML=back()+`<h1>${page==='morning'?'☀️ MORGON':'🏡 HEMMA IGEN'}</h1><p>${n} AV ${a.length} KLARA</p><div class="bar"><i style="width:${n/a.length*100}%"></i></div><div class="row" style="margin-top:12px"><button onclick="mode='one';render()">EN I TAGET</button><button onclick="mode='all';render()">ALLA UPPDRAG</button></div>`+(n===a.length?`<div class="panel"><h2>🎉 DU FIXADE DET!</h2>${avatar()}<button class="big green" onclick="go('world')">BYGG VIDARE!</button><button onclick="mode='all';render();document.querySelector('#alltasks').hidden=false">VISA UPPDRAGEN</button><div id="alltasks" hidden>${a.map(taskHTML).join('')}</div></div>`:mode==='all'?a.map(taskHTML).join(''):`<div class="panel"><div class="symbol">${pic(x)}</div><h2>${esc(x.t[1])}</h2><button class="big green" onclick="mark('${x.k}')">✓ JAG ÄR KLAR!</button><button class="big" onclick="speak(${esc(JSON.stringify(x.t[1]))})">🔊 LYSSNA</button></div>`)+`<button class="big pink" onclick="help()">❤️ HJÄLP MIG</button><div id="help"></div>`;return}if(page==='world'||page==='craft'){let craft=page==='craft',data=s[page];app.innerHTML=back()+`<h1>${craft?'🎨 PYSSELVERKSTAD':'🧱 MIN BYGGVÄRLD'}</h1><p>${craft?'SKAPA FRITT!':s.blocks+' BYGGDELAR KVAR'}</p><div class="row">${['#e997c8','#9d86dc','#6ac8b5','#ffcf69','#79b9ef','#7abd73','#ffffff','#8c624b'].map(c=>`<button aria-label="Färg ${c}" class="swatch" style="background:${c};outline:${color===c?'3px solid #382650':'none'}" onclick="color='${c}';piece='block';render()"></button>`).join('')}</div><div class="row" style="margin:12px 0">${['block','🌳','🏠','🌸','⭐','erase'].map(p=>`<button onclick="piece='${p}';render()" style="background:${piece===p?'#e6d3ff':'white'}">${p==='block'?'🧱':p==='erase'?'SUDDA':p}</button>`).join('')}</div><div class="grid">${Array.from({length:100},(_,i)=>{let v=data[i];return `<button aria-label="Ruta ${i+1}" class="cell" style="background:${v?.c||'#f9f6ff'}" onclick="place(${i})">${v?.p==='block'?'':v?.p||''}</button>`}).join('')}</div><p><small>Välj färg eller figur och tryck på en ruta. Suddade byggdelar kommer tillbaka. Ditt skapande sparas på telefonen.</small></p>`;return}if(page==='avatar'){app.innerHTML=back()+`<h1>MIN AVATAR</h1>${avatar()}<div class="row">${['😊','😎','😺','🤩','👩‍🚀'].map(f=>`<button onclick="s.face='${f}';s.avatar='';save();render()">${f}</button>`).join('')}</div><label>Välj färg <input type="color" value="${s.shirt}" onchange="s.shirt=this.value;s.avatar='';save();render()"></label><label>Egen avatarbild <input type="file" accept="image/*" onchange="photo(this,'avatar')"></label>`;return}if(page==='parent'){app.innerHTML=back()+`<h1>FÖRÄLDRALÄGE</h1><div class="panel"><label>Barnets namn <input id="name" value="${esc(s.name)}" onchange="s.name=this.value;save()"></label><label>Gympadag <select onchange="s.gym=Number(this.value);save()">${['Söndag','Måndag','Tisdag','Onsdag','Torsdag','Fredag','Lördag'].map((d,i)=>`<option value="${i}" ${i==s.gym?'selected':''}>${d}</option>`).join('')}</select></label><small>Helger är lediga. Påminnelser ställs in i Samsungs Klocka eller Kalender; webbappen kan inte garantera larm när den är stängd.</small></div>${['morning','home'].map(p=>`<div class="panel"><h2>${p==='morning'?'Morgon':'Hemkomst'}</h2>${s[p].map((t,i)=>`<label>Uppdrag ${i+1}<input value="${esc(t[1])}" onchange="s.${p}[${i}][1]=this.value;save()"><label><input type="checkbox" ${t[2]?'checked':''} onchange="s.${p}[${i}][2]=this.checked;save()"> Endast gympadag</label><input type="file" accept="image/*" onchange="photo(this,'${p+i}')"><button onclick="removeTask('${p}',${i})">Ta bort</button></label>`).join('')}<button onclick="s.${p}.push(['⭐','NYTT UPPDRAG']);save();render()">+ Lägg till</button></div>`).join('')}<small>Inställningar, bilder och framsteg sparas lokalt. Föräldraläget är inte lösenordsskyddat.</small>`}}function taskHTML(x){return `<button class="task ${s.done[x.k]?'green':''}" onclick="mark('${x.k}')">${pic(x)} ${s.done[x.k]?'✓ ':''}${esc(x.t[1])}</button>`}function help(){document.querySelector('#help').innerHTML='<div class="panel">DET ÄR OKEJ ATT BE OM HJÄLP! ❤️<br>VISA UPPDRAGET FÖR EN VUXEN.</div>';speak('Det är okej att be om hjälp. Visa uppdraget för en vuxen.')}function place(i){let d=s[page],old=d[i];if(piece==='erase'){if(old&&page==='world')s.blocks++;delete d[i]}else{if(!old&&page==='world'){if(s.blocks<=0){alert('Du har inga lösa byggdelar just nu. Du kan skapa fritt i pysselverkstaden!');return}s.blocks--}d[i]={c:color,p:piece}}save();render()}function removeTask(p,i){if(!confirm('Ta bort uppdraget?'))return;s[p].splice(i,1);for(let j=i;j<s[p].length;j++){s.photos[p+j]=s.photos[p+(j+1)];s.done[p+j]=s.done[p+(j+1)];s.earned[p+j]=s.earned[p+(j+1)]}delete s.photos[p+s[p].length];delete s.done[p+s[p].length];delete s.earned[p+s[p].length];save();render()}function photo(input,k){let f=input.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{let im=new Image();im.onload=()=>{let c=document.createElement('canvas'),scale=Math.min(1,400/Math.max(im.width,im.height));c.width=im.width*scale;c.height=im.height*scale;c.getContext('2d').drawImage(im,0,0,c.width,c.height);let url=c.toDataURL('image/webp',.8);if(k==='avatar')s.avatar=url;else s.photos[k]=url;save();render()};im.src=r.result};r.readAsDataURL(f)}render();document.addEventListener('visibilitychange',()=>{if(!document.hidden)render()});</script></html>
